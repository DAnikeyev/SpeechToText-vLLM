name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements/windows.txt
          python -m pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Run unit tests with coverage
        run: coverage run -m unittest discover -s tests -p "test_*.py"

      - name: Coverage report
        run: coverage report --fail-under=50

  build:
    name: Build (windows-latest)
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DictationAssistant-windows
          path: dist/windows/DictationAssistant.exe
          if-no-files-found: error

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DictationAssistant-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DictationAssistant.exe
          generate_release_notes: true
